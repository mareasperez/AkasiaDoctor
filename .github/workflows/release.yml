name: Release Windows executable

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Validate published version tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') {
            throw "Run this workflow on a published version tag such as v1.0.0."
          }
          gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$env:RELEASE_TAG" --silent
          if ($LASTEXITCODE -ne 0) {
            throw "Tag '$env:RELEASE_TAG' is not available on GitHub. Push the tag before running this workflow."
          }

      - name: Check out tagged version
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install Poetry
        run: python -m pip install poetry==2.3.2

      - name: Run tests
        run: |
          poetry install --with build
          poetry run python -m unittest discover -s tests -v

      - name: Build executable
        run: .\build_akasia_doctor.cmd

      - name: Verify executable
        run: |
          & .\dist\AkasiaDoctor.exe --help
          if ($LASTEXITCODE -ne 0) { throw "Packaged executable did not start." }

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG .\dist\AkasiaDoctor.exe --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $env:RELEASE_TAG .\dist\AkasiaDoctor.exe --verify-tag --generate-notes --repo $env:GITHUB_REPOSITORY
          }
          if ($LASTEXITCODE -ne 0) { throw "Could not publish the executable." }