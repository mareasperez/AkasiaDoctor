name: Create version tag

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number without v (for example 1.0.0)"
        required: true
        type: string

permissions:
  contents: write
  actions: write

jobs:
  create-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Create tag and start Windows release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Enter a version number such as 1.0.0 (without v)." >&2
            exit 1
          fi
          tag="v$VERSION"
          gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$tag" -f sha="$TARGET_SHA" --silent
          gh workflow run release.yml --ref "$tag" --repo "$GITHUB_REPOSITORY"
          echo "Created $tag at $TARGET_SHA and queued the Windows release."