[project]
name = "akasiadoctor"
version = "1.0.0"
description = "ClickOnce diagnostics and configuration recovery for Akasia"
readme = "README.md"
requires-python = ">=3.9,<3.16"
dependencies = [
    "textual (>=6.6,<7)",
    "python-dotenv (>=1.2,<2)",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.build]
optional = true

[tool.poetry.group.build.dependencies]
pyinstaller = ">=6.14,<7"